[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haco-stability"
version = "1.0.0rc3"
description = "HACO coordinate-frame stability audit — reproducibility-hardened release candidate"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6,<7",
  "jsonschema>=4.18,<5"
]

[project.scripts]
haco = "haco_stability.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
haco_stability = ["schema/*.json"]
